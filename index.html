<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel McCadden</title>
<meta name="description" content="Manuel McCadden. Applied mathematics and data science at ITAM. Statistical models and the data systems that feed them.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#0a0a0a; --ink:#f2f0ea; --sec:#b0aea5; --muted:#85837b; --hair:rgba(255,255,255,.1); --accent-soft:#86b6ef}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; min-height:100svh}
  a{color:var(--ink); text-decoration:none}
  a:hover{color:var(--accent-soft)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  main{flex:1; display:flex; align-items:center; padding:60px 8vw}
  .card{max-width:640px}
  h1{font-size:clamp(44px,8vw,96px); line-height:.98; letter-spacing:-.03em; margin:0 0 26px; font-weight:650}
  .role{color:var(--sec); font-size:13px; letter-spacing:.06em; margin:0 0 30px}
  .bio{color:var(--sec); font-size:17px; margin:0 0 40px; max-width:44ch}
  .links{display:flex; flex-wrap:wrap; gap:8px 26px; font-size:13.5px; padding-top:24px; border-top:1px solid var(--hair)}
  .links a.primary{color:var(--accent-soft)}
  footer{padding:20px 8vw; color:var(--muted); font-size:12px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Manuel<br>McCadden</h1>
    <p class="role mono">applied mathematics &amp; data science · ITAM · mexico city</p>
    <p class="bio">Statistical models and the systems that feed them. Bayesian inference,
      optimization written from scratch, data pipelines, energy markets.</p>
    <nav class="links mono">
      <a class="primary" href="/embeddings/">projects →</a>
      <a href="https://github.com/manuelmccaddenm">github</a>
      <a href="https://www.linkedin.com/in/manuel-mccadden-madrazo-404899238/">linkedin</a>
      <a href="mailto:manuel.mccaddenm@gmail.com">email</a>
    </nav>
  </div>
</main>
<footer class="mono">© 2026 Manuel McCadden</footer>
</body>
</html>
