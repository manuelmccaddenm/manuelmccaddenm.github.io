<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel McCadden</title>
<meta name="description" content="Manuel McCadden. Applied mathematics and data science at ITAM. Statistical models and the data systems that feed them.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#0a0a0a; --ink:#f2f0ea; --sec:#b0aea5; --muted:#85837b; --faint:#6a6862; --hair:rgba(255,255,255,.1); --accent-soft:#86b6ef; --dot:#ded9cf}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden}
  a{color:var(--ink); text-decoration:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .field{position:fixed; inset:0}
  .field svg{width:100%; height:100%; display:block}
  a.dot{cursor:pointer; outline:none}
  a.dot .core{fill:var(--c,var(--dot)); opacity:.5; transition:opacity .2s, filter .2s}
  a.dot.wip .core{fill:none; stroke:var(--c); stroke-width:2; stroke-dasharray:4 3}
  a.dot.writing .core{fill:none; stroke:var(--c); stroke-width:2}
  a.dot .halo{fill:transparent}
  a.dot .lbl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; fill:var(--ink); text-anchor:middle; opacity:0; transition:opacity .2s}
  a.dot:hover .core, a.dot:focus-visible .core{opacity:1; filter:brightness(1.3)}
  a.dot:hover .lbl, a.dot:focus-visible .lbl{opacity:1}

  .top{position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:24px 32px; font-size:13px; z-index:2; pointer-events:none}
  .top a, .top span{pointer-events:auto}
  .top .brand{color:var(--sec); letter-spacing:.08em}
  .top .links{display:flex; gap:22px}
  .top .links a:hover{color:var(--accent-soft)}

  .fg{position:fixed; left:32px; right:32px; bottom:36px; z-index:2; pointer-events:none; display:flex; justify-content:space-between; align-items:flex-end; gap:40px; flex-wrap:wrap}
  .fg > *{pointer-events:auto}
  .fg h1{font-size:clamp(48px,9vw,128px); line-height:.92; letter-spacing:-.035em; margin:0; font-weight:650; text-shadow:0 0 40px rgba(10,10,10,.9), 0 0 12px rgba(10,10,10,1)}
  .fg .side{max-width:360px; color:var(--sec); font-size:14.5px; text-shadow:0 0 14px rgba(10,10,10,1)}
  .fg .side p{margin:0 0 10px}
  .fg .side .role{color:var(--muted); font-size:12px; letter-spacing:.05em}
  .fg .side a{color:var(--accent-soft)}
  .cap{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1; pointer-events:none; text-align:center; opacity:0; transition:opacity .2s}
  .cap.on{opacity:1}
  .cap .k{font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .cap .t{font-size:clamp(16px,2vw,24px); color:var(--ink); margin:0; text-shadow:0 0 18px rgba(10,10,10,1)}
  @media (max-width:640px){ .fg .side{display:none} }
</style>
</head>
<body>
<div class="field" aria-hidden="false">
  <svg viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice" role="group" aria-label="Project map"><g id="dots"></g></svg>
</div>

<div class="top mono">
  <span class="brand">manuel mccadden</span>
  <span class="links">
    <a href="/embeddings/">embeddings</a>
    <a href="https://github.com/manuelmccaddenm">github</a>
    <a href="https://www.linkedin.com/in/manuel-mccadden-madrazo-404899238/">linkedin</a>
  </span>
</div>

<div class="cap mono" id="cap"><p class="k" id="cap-k"></p><p class="t" id="cap-t"></p></div>

<div class="fg">
  <h1>Manuel<br>McCadden</h1>
  <div class="side">
    <p class="role mono">applied mathematics &amp; data science · ITAM</p>
    <p>Statistical models and the systems that feed them. Each point behind this text is a
       project, placed next to what it's most like. <a href="/embeddings/">Open the map →</a></p>
    <p class="mono" style="font-size:12.5px"><a href="mailto:manuel.mccaddenm@gmail.com">manuel.mccaddenm@gmail.com</a></p>
  </div>
</div>

<script src="/embeddings/data.js"></script>
<script>
const { CLUSTERS, PROJECTS } = window;
const svgNS = "http://www.w3.org/2000/svg";
const dotsG = document.getElementById("dots");
const cap = document.getElementById("cap"), capK = document.getElementById("cap-k"), capT = document.getElementById("cap-t");
PROJECTS.forEach(p => {
  const a = document.createElementNS(svgNS, "a");
  a.setAttribute("href", "/embeddings/#" + p.id);
  a.setAttribute("class", "dot " + p.kind);
  a.setAttribute("aria-label", p.title);
  a.style.setProperty("--c", CLUSTERS[p.cluster].color);
  a.setAttribute("transform", `translate(${p.x},${p.y})`);
  const halo = document.createElementNS(svgNS, "circle"); halo.setAttribute("class","halo"); halo.setAttribute("r","22");
  const core = document.createElementNS(svgNS, "circle"); core.setAttribute("class","core"); core.setAttribute("r","6");
  const lbl = document.createElementNS(svgNS, "text"); lbl.setAttribute("class","lbl"); lbl.setAttribute("y","24"); lbl.textContent = p.label;
  a.append(halo, core, lbl);
  const show = () => { cap.classList.add("on"); capK.textContent = CLUSTERS[p.cluster].name; capK.style.color = CLUSTERS[p.cluster].color; capT.textContent = p.title; };
  const hide = () => cap.classList.remove("on");
  a.addEventListener("mouseenter", show); a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hide); a.addEventListener("blur", hide);
  dotsG.appendChild(a);
});
</script>
</body>
</html>
