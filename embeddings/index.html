  g.dataset.id = p.id;

  const glow = document.createElementNS(svgNS, "circle");

  const halo = document.createElementNS(svgNS, "circle");

  title: document.getElementById("p-title"),
  meta: document.getElementById("p-meta"),
  body: document.getElementById("p-body"),
  links: document.getElementById("p-links"),
};
let openId = null;

function openPanel(id) {
  const p = byId[id]; if (!p) return;
  openId = id;
  els.kicker.textContent = CLUSTERS[p.cluster].name + (p.kind === "wip" ? " · in progress" : p.kind === "writing" ? " · writing" : "");
  els.kicker.style.color = CLUSTERS[p.cluster].color;
  els.title.textContent = p.title;
  els.meta.textContent = p.meta;
  els.body.innerHTML = "";
  p.body.forEach(t => { const el = document.createElement("p"); el.textContent = t; els.body.appendChild(el); });
  els.links.innerHTML = "";
  (p.links || []).forEach(l => {
    const a = document.createElement("a");
    a.href = l.href; a.textContent = l.label + " ↗";
    if (/^https?:/.test(l.href)) { a.target = "_blank"; a.rel = "noopener"; }
    els.links.appendChild(a);
  });
  panel.hidden = false; backdrop.hidden = false;
  document.querySelectorAll("g.dot.active").forEach(d => d.classList.remove("active"));
  const g = document.querySelector(`g.dot[data-id="${id}"]`);
  if (g) g.classList.add("active");
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  panel.querySelector(".close").focus({ preventScroll: true });
}

function closePanel() {
  openId = null;
  panel.hidden = true; backdrop.hidden = true;
  document.querySelectorAll("g.dot.active").forEach(d => d.classList.remove("active"));
  history.replaceState(null, "", location.pathname);
}

panel.querySelector(".close").addEventListener("click", closePanel);
backdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape" && openId) closePanel(); });

// deep link
if (location.hash && byId[location.hash.slice(1)]) openPanel(location.hash.slice(1));
</script>
</body>
</html>
